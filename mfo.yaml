openapi: 3.0.3
info:
  title: "1С:Микрофинансовая организация"
  description: | 
    Сервис микрокредитования
  version: kz
servers:
  - url: http: //127.0.0.1/1c_mfo/hs/
security:
  - basicAuth: []

paths:
  /leads/completed:
    patch:
      tags:
        - Заявки на кредит
      summary: Меняет статус заявки на "Выдача займа"
      description: Метод для перевода Заявки на кредит в статус "Выдача займа"
      requestBody:
        required: true
        description: Описание для JSON
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestSetStatusCompleted'
      responses:
        '200':
          description: Успешное выполнение операции
        '400':
          description: Ошибка выполнения запроса
        '409':
          description: Статус заявки не позволяет выполнить отказ от кредита
  /leads/cancel:
    patch:
      tags:
        - Заявки на кредит
      summary: Меняет статус заявки на "Отказ от займа"
      description: Метод для перевода Заявки на кредит в статус "Отказ от займа"
      requestBody:
        required: true
        description: Описание для JSON
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestSetStatusCancelled'
      responses:
        '200':
          description: Успешное выполнение операции
        '400':
          description: Ошибка выполнения запроса
        '409':
          description: Статус заявки не позволяет выполнить отказ от кредита
  /leads/loan_application_info/{creditPipelineNumber
}:
    get:
      tags:
        - Личный кабинет
      summary: Получение информации по заявке
      description: Получение информации по заявке
      parameters:
        - name: creditPipelineNumber
          in: path
          required: true
          description: НомерКК
          schema:
            type: string
            example: "1234567890"
      responses:
        '200':
          description: Успешное выполнение операции
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseLoanApplicationInfo'
        '404':
          description: Ресурс не найден
  /leads/repayment_options/{creditPipelineNumber
}:
    get:
      tags:
        - Личный кабинет
      summary: Варианты погашения кредита
      description: Возвращает варианты погашения кредита: очередной ежемесячный платеж и досрочное погашение
      parameters:
        - name: creditPipelineNumber
          in: path
          required: true
          description: Номер заявки в кредитном конвейере
          schema:
            type: string
            example: "1234567890"
      responses:
        '200':
          description: Успешное выполнение операции
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseRepaymentOptions'
        '400':
          description: Ошибка выполнения запроса
        '404':
          description: Ресурс не найден
  /leads/credit_agreement_info/{agreementNumber
}:
    get:
      tags:
        - Для цессии
      summary: Вся информация по ИИН
      description: Вся информация по клиенту для личного кабинета
      parameters:
        - name: agreementNumber
          in: path
          required: true
          description: Номер кредитного соглашения
          schema:
            type: string
            example: "CL40000000055"
      responses:
        '200':
          description: Успешное выполнение операции
          content: 
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResponseCreditAgreementInfo'
        '404':
          description: Ресурс не найден
  /leads/active_credit_agreements/{IIN
}:
    get:
      tags:
        - Для цессии
      summary: Получение данных по активным кредитным соглашениям клиента
      description: Получение данных по кредитным соглашениям клиента
      parameters:
        - name: IIN
          in: path
          required: true
          description: ИИН
          schema:
            type: string
            example: "951109400079"
      responses:
        '200':
          description: Успешное выполнение операции
          content: 
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResponseLineActiveClientAgreements'
        '404':
          description: Ресурс не найден
  /leads/active_credit_agreements:
    get:
      tags:
        - Для цессии
      summary: Получение активных соглашений
      description: Получение активных соглашений
      responses:
        '200':
          description: Успешное выполнение операции
          content: 
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResponseLineActiveCreditAgreements'
        '404':
          description: Ресурс не найден
  /leads/swaggerfile:
    get:
      tags:
        - Служебное
      summary: Получение файла описания
      description: Получение файла описания
      responses:
        '200':
          description: Успешное выполнение операции
  /leads/ping:
    get:
      tags:
        - Служебное
      summary: Тестирование соединения
      description: Тестирование соединения
      responses:
        '200':
          description: Успешное выполнение операции
  /leads/schedule/{KKNumber
}/{loanRepaymentProcedure
}/{issueDate
}:
    get:
      tags:
        - График платежей
      summary: Сервис для получения графика платежей
      description: Делает предварительный расчет графика платежей (не сохраняет результат)
      parameters:
        - name: KKNumber
          in: path
          required: true
          description: Номер заявки в кредитном конвеере
          schema:
            type: string
            example: "1234567890"
        - name: loanRepaymentProcedure
          in: path
          required: true
          description: |
            Порядок погашения кредита
              - annuity (аннуитетный)
              - differentiated (дифференцированный)

          schema:
            type: string
            example: "annuity"
        - name: issueDate
          in: path
          required: true
          description: Дата выдачи
          schema:
            type: string
            example: "2026-05-18"
      responses:
        '200':
          description: Успешное выполнение операции
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsePaymentSchedule'
        '400':
          description: Ошибка выполнения запроса
        '404':
          description: Ресурс не найден
components:
  schemas:
    ResponseEarlyRepaymentOption:
      type: object
      properties:
        paymentDate:
          type: string
          format: date
          example: "2026-03-17T11:59:43"
          description: Дата платежа
        paymentAmount:
          type: number
          example: 10 000 000.00
          description: Сумма платежа
        paymentStatus:
          type: string
          minLength: 1
          maxLength: 100
          example: "Ожидает оплаты"
          description: Статус платежа
        debtAfterPayment:
          type: number
          example: 10 000 000.00
          description: Текущая задолженность после оплаты
        loanStatus:
          type: string
          minLength: 1
          maxLength: 100
          example: "Досрочно погашен"
          description: Статус кредита после оплаты
        loanClosingDate:
          type: string
          format: date
          example: "2026-03-17T11:59:43"
          description: Дата закрытия кредита
    ResponseRegularPaymentOption:
      type: object
      properties:
        paymentDate:
          type: string
          format: date
          example: "2026-03-17T11:59:43"
          description: Дата платежа
        paymentAmount:
          type: number
          example: 10 000 000.00
          description: Сумма платежа
        paymentStatus:
          type: string
          minLength: 1
          maxLength: 100
          example: "Ожидает оплаты"
          description: Статус платежа
        debtAfterPayment:
          type: number
          example: 10 000 000.00
          description: Текущая задолженность после оплаты
        nextPaymentDate:
          type: string
          format: date
          example: "2026-03-17T11:59:43"
          description: Дата следующего платежа
        nextPaymentAmount:
          type: number
          example: 10 000 000.00
          description: Сумма следующего платежа
        loanStatus:
          type: string
          minLength: 1
          maxLength: 100
          example: "Действующий"
          description: Статус кредита после оплаты
    PaymentScheduleLine:
      type: object
      properties:
        lineNumber:
          type: number
          example: 1
          description: 
        period:
          type: string
          format: date
          example: 26.11.2025 0: 00: 00
          description: 
        paymentDate:
          type: string
          format: date
          example: 26.11.2025 0: 00: 00
          description: 
        principalDebt:
          type: number
          example: 10 000 000.00
          description: 
        reward:
          type: number
          example: 10 000 000.00
          description: 
        totalPayment:
          type: number
          example: 10 000 000.00
          description: 
        remainingDebtBeforePaiment:
          type: number
          example: 10 000 000.00
          description: 
        remainingDebtAfterPayment:
          type: number
          example: 10 000 000.00
          description: 
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: "KZT"
          description: 
        paymentStatus:
          type: string
          minLength: 1
          maxLength: 10
          example: "PLANNED"
          description: 
    OverduesLine:
      type: object
      properties:
        period:
          type: string
          format: date
          example: 26.11.2025 0: 00: 00
          description: 
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: "KZT"
          description: 
        debtType:
          type: string
          minLength: 1
          maxLength: 250
          example: "Вознаграждение"
          description: 
        amount:
          type: number
          example: 1 000.00
          description: 
    ResponseLineForPersonalAccount:
      type: object
      properties:
        date:
          type: string
          format: date
          example: 26.11.2025 0: 00: 00
          description: 
        number:
          type: string
          minLength: 13
          maxLength: 13
          example: "CL40000000055"
          description: 
        schedule:
          type: array
          items:
            $ref: '#/components/schemas/PaymentScheduleLine'
        overdues:
          type: array
          items:
            $ref: '#/components/schemas/OverduesLine'
        debt:
          type: array
          items:
            $ref: '#/components/schemas/DebtLine'
    ResponsePaymentSchedule:
      type: object
      properties:
        annualEffectiveInterestRate:
          type: number
          example: 12.8
          description: ГЭСВ
        schedule:
          type: array
          items:
            $ref: '#/components/schemas/PaymentScheduleLine'
    RequestSetStatusCompleted:
      type: object
      properties:
        creditPipelineNumber:
          type: string
          minLength: 1
          maxLength: 10
          example: "1234567890"
          description: Номер заявки в кредитном конвеере
    ResponseLineActiveCreditAgreements:
      type: object
      properties:
        agreementNumber:
          type: string
          minLength: 13
          maxLength: 13
          example: "CL40000000055"
          description: 
        odBalance:
          type: number
          example: 10 000 000.00
          description: Сумма основного долга по кредитному соглашению
        accruedReward:
          type: number
          example: 10 000 000.00
          description: Не уплаченное начисленное вознаграждение с датой платежа до текущего момента
        lastPayDate:
          type: string
          format: date
          example: "2026-03-17T11:59:43"
          description: Дата последнего платежа
        lastPayAmount:
          type: number
          example: 10 000 000.00
          description: Сумма последнего платежа
        overdueDays:
          type: number
          example: 1
          description: Количество просроченных дней
        overdueAmt:
          type: number
          example: 10 000 000.00
          description: Просроченная сумма
        firstTwoPaymentsDone:
          type: boolean
          example: false
          description: Отметка оплачены ли два первых платежа
        restructuring:
          type: boolean
          example: false
          description: Отметка произведена ли реструктуризация долга
        monthlyPayment:
          type: number
          example: 10 000 000.00
          description: Сумма первого ежемесячного платежа
    ResponseLineActiveClientAgreements:
      type: object
      properties:
        agreementNumber:
          type: string
          minLength: 13
          maxLength: 13
          example: "CL40000000055"
          description: 
        annualInterestRate:
          type: number
          example: 12.8
          description: Годовая процентная ставка
        annualEffectiveInterestRate:
          type: number
          example: 12.8
          description: ГЭСВ
        principalDebt:
          type: number
          example: 10 000 000.00
          description: Сумма основного долга по кредитному соглашению
        reward:
          type: number
          example: 10 000 000.00
          description: Сумма вознаграждения по кредитному соглашению
        remainingDebt:
          type: number
          example: 10 000 000.00
          description: Остаток долга
        toBePaid:
          type: number
          example: 10 000 000.00
          description: К оплате
    ResponseCreditAgreementInfo:
      type: object
      properties:
        agreementNumber:
          type: string
          minLength: 13
          maxLength: 13
          example: "CL40000000055"
          description: 
        odBalance:
          type: number
          example: 10 000 000.00
          description: Сумма основного долга по кредитному соглашению
        accruedReward:
          type: number
          example: 10 000 000.00
          description: Не уплаченное начисленное вознаграждение с датой платежа до текущего момента
        lastPayDate:
          type: string
          format: date
          example: "2026-03-17T11:59:43"
          description: Дата последнего платежа
        lastPayAmount:
          type: number
          example: 10 000 000.00
          description: Сумма последнего платежа
        overdueDays:
          type: number
          example: 1
          description: Количество просроченных дней
        overdueAmt:
          type: number
          example: 10 000 000.00
          description: Просроченная сумма
        firstTwoPaymentsDone:
          type: boolean
          example: false
          description: Отметка оплачены ли два первых платежа
        restructuring:
          type: boolean
          example: false
          description: Отметка произведена ли реструктуризация долга
        monthlyPayment:
          type: number
          example: 10 000 000.00
          description: Сумма первого ежемесячного платежа
    DebtLine:
      type: object
      properties:
        document:
          type: string
          minLength: 1
          maxLength: 250
          example: "Кредитное соглашение 1-000000000000000001 от 10.10.2025 10:00:00"
          description: 
        period:
          type: string
          format: date
          example: 26.11.2025 0: 00: 00
          description: 
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: "KZT"
          description: 
        debtType:
          type: string
          minLength: 1
          maxLength: 250
          example: "Вознаграждение"
          description: 
        amount:
          type: number
          example: 1 000.00
          description: 
        amountIn:
          type: number
          example: 1 000.00
          description: 
        amountOut:
          type: number
          example: 1 000.00
          description: 
    ResponseRepaymentOptions:
      type: object
      properties:
        creditPipelineNumber:
          type: string
          minLength: 1
          maxLength: 10
          example: "1234567890"
          description: Номер заявки в кредитном конвейере
        regularPayment:
          $ref: '#/components/schemas/ResponseRegularPaymentOption'
        earlyRepayment:
          $ref: '#/components/schemas/ResponseEarlyRepaymentOption'
    RequestSetStatusCancelled:
      type: object
      properties:
        creditPipelineNumber:
          type: string
          minLength: 1
          maxLength: 10
          example: "1234567890"
          description: Номер заявки в кредитном конвеере
        refusalReason:
          type: string
          minLength: 1
          maxLength: 150
          example: "Передумал"
          description: Причина отказа
        comment:
          type: string
          minLength: 1
          maxLength: 250
          example: "Комментарий"
          description: Комментарий
    ResponseLoanApplicationInfo:
      type: object
      properties:
        firstPaymentDate:
          type: string
          format: date
          example: "2026-03-17T11:59:43"
          description: Дата первого платежа
        firstPaymentAmount:
          type: number
          example: 10 000 000.00
          description: Сумма первого платежа
        totalRepaymentAmount:
          type: number
          example: 10 000 000.00
          description: Общая сумма погашения
        principalDebt:
          type: number
          example: 10 000 000.00
          description: Сумма основного долга по кредитному соглашению
        reward:
          type: number
          example: 10 000 000.00
          description: Сумма вознаграждения по кредитному соглашению
        commissions:
          type: number
          example: 10 000 000.00
          description: Комиссии и иные платежи
        loanOverpayment:
          type: number
          example: 10 000 000.00
          description: Переплата по кредиту